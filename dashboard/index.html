    ${lineChart("floor", { x, series: [{ name: "Coin-in", color: "--s1", values: fd.map(r => r.coin_in_usd) }], bands: evBands, height: 250, label: "Daily floor coin-in" })}
    <details><summary>Show the event lifts as a table</summary><div class="tw"><table><thead><tr><th>Event</th><th>Type</th><th>Dates</th><th class="n">Lift vs. same-weekday median</th></tr></thead><tbody>
      ${D.event_lift.map(e => `<tr><td>${esc(e.name)}</td><td>${esc(e.event_type.replace("_", " "))}</td><td class="mono">${shortDate(e.start_date)}–${shortDate(e.end_date)}</td><td class="n">${spct(e.lift)}</td></tr>`).join("")}</tbody></table></div></details>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><h3>Back Forty lives on foot traffic</h3><div class="sub">Coin-in per machine-day by week. Shaded: walkway W-ENT-B40 from the Main Entrance closed for renovation (Mar 3 – Apr 6).</div>
      ${legend([{ label: "Back Forty", color: "--s2", line: true }, { label: "Rest of floor", color: "--axis", line: true }])}
      ${lineChart("zones", { x: weeks, series: [{ name: "Back Forty", color: "--s2", values: b40, endLabel: true }, { name: "Rest of floor", color: "--axis", values: others }], bands: [{ from: "2025-03-03", to: "2025-03-31", color: "--brass-wash" }].filter(() => weeks.length), height: 220, yMin: 0, label: "Weekly coin-in per machine-day, Back Forty vs rest of floor" })}
    </div>
    <div class="panel"><h3>Natural experiments</h3><div class="sub">Full Jan–Jun window. Effect = treated change ÷ control change − 1.</div>
      <div class="tw"><table><thead><tr><th>Change</th><th class="n">Treated</th><th class="n">Control</th><th class="n">Effect</th></tr></thead><tbody>
      ${D.experiments.map(e => `<tr><td>${esc(e.experiment)}<div class="small muted">${esc(e.window_note)}</div></td><td class="n">${spct(e.treated_change)}</td><td class="n">${spct(e.control_change)}</td><td class="n"><b>${spct(e.did_effect)}</b></td></tr>`).join("")}
      </tbody></table></div>
      <div class="findings">
        <div class="finding">Closing one walkway cut Back Forty play by <b>${spct(-(-D.experiments[0].did_effect), 0)}</b> and its door counter by the same share: the zone's low earnings are largely a <b>location</b> problem, and a new cabinet in the same slot inherits that part of the gap.</div>
        <div class="finding">The eight Aurora Link machines added on Mar 24 run at <b>1.37×</b> par without taking play from their Center Pit neighbours (${spct(D.experiments[2].did_effect)}). New titles can lift a spot.</div>
        <div class="finding">High-Limit's average bet fell from $5.03 to $4.28 after a $5-minimum Platinum Reels was retired on Feb 25 and replaced by a $1 Classic Sevens.</div>
      </div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>The city around us</h3><div class="sub">Las Vegas visitor numbers are real LVCVA data, published after 2025: context for explaining the past, never an input to the forecast.</div>
    <div class="tw"><table><thead><tr><th>Month</th><th class="n">Floor coin-in per day</th><th class="n">LV visitors vs. prior year</th><th class="n">LV convention attendance</th></tr></thead><tbody>
    ${monthly.map(r => `<tr><td>${monthLabel(r.m)}</td><td class="n">${fmtK(r.ci)}</td><td class="n">${spct(r.yoy)}</td><td class="n">${n0(r.conv)}</td></tr>`).join("")}</tbody></table></div>
    <div class="findings"><div class="finding">June's floor coin-in per day was the lowest of the half-year, the month Las Vegas visitation fell 11.3% year on year and convention attendance hit its low. Locals' carded play held steady; domestic and regional play fell.</div></div>
  </div></section>`;
}
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

function sectionDowntime() {
  const dl = D.downtime_lost.filter(r => inPeriod(String(r.gaming_date).slice(0, 10)));
  const lost = sum(dl.map(r => r.lost_theo_usd)), hrs = sum(dl.map(r => r.downtime_hours));
  const by = (k) => { const o = {}; dl.forEach(r => o[r[k]] = (o[r[k]] || 0) + r.lost_theo_usd); return o; };
  const byShift = by("tech_shift"), byMfr = by("manufacturer"), byZone = by("zone_name");
  const months = monthsInPeriod(), byMonth = months.map(m => sum(dl.filter(r => r.month === m).map(r => r.lost_theo_usd)));
  const floorTheo = sum(D.floor_day.filter(r => inPeriod(String(r.gaming_date).slice(0, 10))).map(r => r.theo_usd));
  const rel = D.manufacturer_reliability;
  const wait = D.wait_vs_staffing;
  return `<section id="downtime">
  <div class="sec-head"><div class="q">Question 3 · How much play was lost to downtime, and when?</div><h2>Downtime is real, but small and concentrated</h2>
  <p class="lede">Every idle machine-second is priced at what an available machine in the same zone, at the same hour and day type, actually took in. A 3 a.m. outage in Back Forty costs far less than a Saturday-night outage at the Main Entrance.</p></div>
  <div class="grid g4" style="margin-bottom:16px">
    ${tile("Theo lost to downtime", fmtK(lost), `${pct(lost / floorTheo, 2)} of floor theo in the period`)}
    ${tile("Machine-hours down", n0(hrs), "Faults, repairs, moves and installs")}
    ${tile("Ridgeline share of the loss", pct((byMfr.Ridgeline || 0) / (lost || 1), 0), "94 of the 310 machines")}
    ${tile("Grave-shift wait for a tech", (wait.find(w => w.tech_shift === "grave")?.avg_wait_hours ?? 0).toFixed(1) + " h", "One tech on shift; two-tech shifts wait about 0.1 h")}
  </div>
  <div class="grid g3">
    <div class="panel"><h3>Lost theo by month</h3><div class="sub">May spikes when day-shift techs were short (17 short-staffed shifts in April, 25 in May).</div>
      ${hbars(months.map((m, i) => ({ label: monthLabel(m), value: byMonth[i] })), { color: "--s3" })}</div>
    <div class="panel"><h3>By manufacturer</h3><div class="sub">Ridgeline fails ${rel.find(r => r.manufacturer === "Ridgeline").faults_per_100_machine_days.toFixed(1)} times per 100 machine-days vs. ${rel.find(r => r.manufacturer === "Northwind").faults_per_100_machine_days.toFixed(1)} (Northwind) and ${rel.find(r => r.manufacturer === "Halcyon").faults_per_100_machine_days.toFixed(1)} (Halcyon).</div>
      ${hbars(Object.entries(byMfr).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v })), { color: "--s3" })}
      <p class="src">Six-month repair cost: ${rel.map(r => `${r.manufacturer} ${fmtK(r.repair_cost_usd)}`).join(" · ")}</p></div>
    <div class="panel"><h3>By technician shift</h3><div class="sub">When the fault started. Swing carries the most play, grave the longest waits.</div>
      ${hbars(["day", "swing", "grave"].map(k => ({ label: k[0].toUpperCase() + k.slice(1) + (k === "day" ? " 06–14" : k === "swing" ? " 14–22" : " 22–06"), value: byShift[k] || 0 })), { color: "--s3" })}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>Does staffing change response time?</h3><div class="sub">Each fault ticket matched to the techs actually on shift when it opened (full window).</div>
    <div class="tw"><table><thead><tr><th>Shift</th><th class="n">Techs on shift</th><th>Staffing</th><th class="n">Tickets</th><th class="n">Wait for tech</th><th class="n">Time to fix</th></tr></thead><tbody>
    ${wait.map(w => `<tr><td>${w.tech_shift}</td><td class="n">${w.techs_on_shift}</td><td>${w.short_staffed ? '<span class="chip"><span class="dot" style="background:var(--warn)"></span>Short-staffed</span>' : "As planned"}</td><td class="n">${w.fault_tickets}</td><td class="n">${w.avg_wait_hours.toFixed(2)} h</td><td class="n">${w.avg_fix_hours.toFixed(2)} h</td></tr>`).join("")}</tbody></table></div>
    <div class="findings"><div class="finding">Fix time is about 3 h whatever the staffing; waiting is what changes. But a grave-shift downtime hour is worth only about $16 of theo, so an extra grave technician ($11,520) would recover about $1,000 in July. <a href="#plan">Not funded</a>.</div></div>
  </div></section>`;
}

function sectionPlayers() {
  const months = monthsInPeriod();
  const segs = D.player_segment_month.filter(r => months.includes(r.month) && (S.tier === "all" || r.opening_tier === S.tier) && (S.age === "all" || r.age_band === S.age) && (S.region === "all" || r.home_region === S.region));
  const t = k => sum(segs.map(r => r[k]));
  const opts = (k) => [...new Set(D.player_segment_month.map(r => r[k]))].sort();
  const sel = (id, k, cur, lbl) => `<label class="small ink2">${lbl} <select id="${id}"><option value="all">All</option>${opts(k).map(o => `<option${o === cur ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
  const byTier = opts("opening_tier").map(tr => { const r = segs.filter(s => s.opening_tier === tr); return { tr, pm: sum(r.map(x => x.playing_player_months)), ci: sum(r.map(x => x.coin_in_usd)), net: sum(r.map(x => x.player_net_usd)), theo: sum(r.map(x => x.theo_usd)), ahead: sum(r.map(x => x.ahead_player_months)), comp: sum(r.map(x => x.comp_cost_usd)) }; });
  const conc = D.player_concentration;
  const segColors = ["--s1", "--s2", "--s3", "--s4", "--s5"];
  const seg = (k) => `<div class="segbar" role="img" aria-label="Share of ${k} by player band">${conc.map((c, i) => `<div style="flex:${Math.max(c[k], 0.001)};background:var(${segColors[i]})" class="${segColors[i] === "--s4" ? "dark-ink" : ""}" data-tip="${esc(tipRows(c.band.slice(3), [["Players", n0(c.players)], ["Share", pct(c[k], 1)]]))}">${c[k] > 0.08 ? pct(c[k], 0) : ""}</div>`).join("")}</div>`;
  return `<section id="players">
  <div class="sec-head"><div class="q">Question 4 · What did tracked players wager, get back and net?</div><h2>Results are concentrated, and most players lose a little</h2>
  <p class="lede">Loyalty-card (tracked) play only, about two thirds of all coin-in. Player net = payout − coin-in; luck = net + theo. Nothing here is used to target heavier losers.</p></div>
  <div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">${sel("f-tier", "opening_tier", S.tier, "Tier")}${sel("f-age", "age_band", S.age, "Age band")}${sel("f-region", "home_region", S.region, "Home region")}<span class="small muted" style="align-self:center">${months.map(monthLabel).join(", ")}</span></div>
    <div class="grid g4">
      ${tile("Tracked coin-in", fmtK(t("coin_in_usd")), `${n0(t("playing_player_months"))} playing player-months`)}
      ${tile("Paid back", fmtK(t("payout_usd")), `${pct(t("payout_usd") / t("coin_in_usd"), 1)} of coin-in`)}
      ${tile("Players' net result", fmtSigned(t("player_net_usd")), `Theo ${fmtK(t("theo_usd"))}; luck ${fmtSigned(t("luck_usd"))}`)}
      ${tile("Months finished ahead", pct(t("ahead_player_months") / t("playing_player_months"), 1), "Share of playing player-months with net > 0")}
    </div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Opening tier</th><th class="n">Player-months</th><th class="n">Coin-in</th><th class="n">Net</th><th class="n">Theo</th><th class="n">Ahead</th><th class="n">Comp cost / theo</th></tr></thead><tbody>
    ${byTier.map(r => `<tr><td>${esc(r.tr)}</td><td class="n">${n0(r.pm)}</td><td class="n">${fmtK(r.ci)}</td><td class="n">${fmtSigned(r.net)}</td><td class="n">${fmtK(r.theo)}</td><td class="n">${pct(r.ahead / (r.pm || 1), 1)}</td><td class="n">${pct(r.comp / (r.theo || 1), 2)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>How concentrated are results?</h3><div class="sub">Players ranked by six-month theo (full window, ${n0(sum(conc.map(c => c.players)))} tracked players with play).</div>
    ${legend(conc.map((c, i) => ({ label: c.band.slice(3), color: segColors[i] })))}
    <div class="small ink2" style="margin:6px 0 4px">Share of theo</div>${seg("share_of_theo")}
    <div class="small ink2" style="margin:12px 0 4px">Share of players' losses</div>${seg("share_of_player_losses")}
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Band</th><th class="n">Players</th><th class="n">Theo</th><th class="n">Net</th><th class="n">Finished ahead</th><th class="n">Comp / theo</th></tr></thead><tbody>
    ${conc.map(c => `<tr><td>${esc(c.band.slice(3))}</td><td class="n">${n0(c.players)}</td><td class="n">${fmtK(c.theo_usd)}</td><td class="n">${fmtSigned(c.player_net_usd)}</td><td class="n">${pct(c.share_ahead, 1)}</td><td class="n">${pct(c.comp_reinvestment, 2)}</td></tr>`).join("")}</tbody></table></div>
    <div class="findings"><div class="finding">The top 5% of tracked players generate <b>${pct(conc[0].share_of_theo + conc[1].share_of_theo, 0)}</b> of tracked theo and carry about half of all player losses. Only 16% of players finished the half-year ahead. Any guest program here should protect, not push: no offer in this plan is aimed at loss size.</div></div>
  </div></section>`;
}

function sectionComps() {
  const cp = D.comp_price_day.filter(r => inPeriod(String(r.gaming_date).slice(0, 10)));
  const x = cp.map(r => String(r.gaming_date).slice(0, 10));
  const t = D.comp_change_test, bef = t.find(r => r.period === "before"), aft = t.find(r => r.period === "after");
  const cm = D.comp_month;
  const did = (aft.carded_coin_in_per_day / bef.carded_coin_in_per_day) / (aft.uncarded_coin_in_per_day / bef.uncarded_coin_in_per_day) - 1;
  const shares = cm.map(r => r.carded_share_of_coin_in), mean = sum(shares) / shares.length, sd = Math.sqrt(sum(shares.map(s => (s - mean) ** 2)) / (shares.length - 1));
  return `<section id="comps">
  <div class="sec-head"><div class="q">Question 5 · What did the comp program cost, and did anything change?</div><h2>On May 1, comps got 55% cheaper in points</h2>
  <p class="lede">Comp cost is the house's cost of the item (already inside food-and-beverage cost of goods, counted once). Reinvestment = comp cost ÷ tracked theo.</p></div>
  <div class="grid g4" style="margin-bottom:16px">
    ${tile("Points per comp dollar", `${bef.points_per_face_dollar.toFixed(1)} → ${aft.points_per_face_dollar.toFixed(1)}`, "Menu-value dollar, before vs. after May 1; the floor-wide setting allows 5 to 20")}
    ${tile("Comp cost per day", `${fmtUSD(bef.comp_cost_per_day)} → ${fmtUSD(aft.comp_cost_per_day)}`, spct(aft.comp_cost_per_day / bef.comp_cost_per_day - 1) + " after the cut")}
    ${tile("Reinvestment", `${pct(bef.comp_reinvestment, 2)} → ${pct(aft.comp_reinvestment, 2)}`, "Comp cost as a share of tracked theo")}
    ${tile("Carded share of play", `${pct(bef.carded_share, 1)} → ${pct(aft.carded_share, 1)}`, `Change ${spct(aft.carded_share - bef.carded_share, 1)}; months vary by ±${(sd * 100).toFixed(1)} pt`)}
  </div>
  <div class="grid g2">
    <div class="panel"><h3>What a comp cost in points, by day</h3><div class="sub">Points spent per dollar of menu value. A step, not a drift: one policy change on gaming day May 1.</div>
      ${lineChart("comp", { x, series: [{ name: "Points per comp dollar", color: "--s1", values: cp.map(r => r.points_per_face_dollar) }], yfmt: v => v.toFixed(0), height: 220, yMin: 0, marks: x.includes("2025-05-01") ? [{ date: "2025-05-01", label: "May 1 price cut" }] : [], label: "Points per comp dollar by day" })}</div>
    <div class="panel"><h3>Did cheaper comps buy play?</h3><div class="sub">Carded play (exposed to the change) tested against uncarded play (not exposed), Jan–Apr vs. May–Jun.</div>
      <div class="tw"><table><thead><tr><th></th><th class="n">Before</th><th class="n">After</th><th class="n">Change</th></tr></thead><tbody>
        <tr><td>Carded coin-in per day</td><td class="n">${fmtK(bef.carded_coin_in_per_day)}</td><td class="n">${fmtK(aft.carded_coin_in_per_day)}</td><td class="n">${spct(aft.carded_coin_in_per_day / bef.carded_coin_in_per_day - 1)}</td></tr>
        <tr><td>Uncarded coin-in per day</td><td class="n">${fmtK(bef.uncarded_coin_in_per_day)}</td><td class="n">${fmtK(aft.uncarded_coin_in_per_day)}</td><td class="n">${spct(aft.uncarded_coin_in_per_day / bef.uncarded_coin_in_per_day - 1)}</td></tr>
        <tr><td>Comps redeemed per day</td><td class="n">${n0(bef.comps_per_day)}</td><td class="n">${n0(aft.comps_per_day)}</td><td class="n">${spct(aft.comps_per_day / bef.comps_per_day - 1)}</td></tr>
        <tr><td><b>Carded vs. uncarded</b></td><td></td><td></td><td class="n"><b>${spct(did)}</b></td></tr>
      </tbody></table></div>
      <div class="findings"><div class="finding">Cost rose about $78 a day and reinvestment rose 0.12 pt. Carded play may have gained ${spct(did, 1)} against uncarded play, but monthly carded share moves by ±${(sd * 100).toFixed(1)} pt on its own, so two months cannot tell a real lift from noise. Only a randomised pilot can (priced in the plan; not chosen this month).</div></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>By month</h3><div class="tw"><table><thead><tr><th>Month</th><th class="n">Comps</th><th class="n">Comp cost</th><th class="n">Menu value</th><th class="n">Points / comp $</th><th class="n">Reinvestment</th><th class="n">Carded share</th></tr></thead><tbody>
    ${cm.filter(r => monthsInPeriod().includes(r.month)).map(r => `<tr><td>${monthLabel(r.month)}</td><td class="n">${n0(r.comps_redeemed)}</td><td class="n">${fmtUSD(r.comp_cost_usd)}</td><td class="n">${fmtUSD(r.comp_face_value_usd)}</td><td class="n">${r.points_per_face_dollar.toFixed(1)}</td><td class="n">${pct(r.comp_reinvestment, 2)}</td><td class="n">${pct(r.carded_share_of_coin_in, 1)}</td></tr>`).join("")}</tbody></table></div></div>
  </section>`;
}

function sectionModel() {
  const fc = D.forecast, x = fc.map(r => String(r.gaming_date).slice(0, 10));
  const p = D.forecast_params[0], met = D.forecast_metrics, selT = D.forecast_selection;
  const propLifts = D.event_lift.filter(e => e.local_scope === "property").map(e => e.lift);
  const avgLift = propLifts.length ? sum(propLifts) / propLifts.length : null;
  const hold = met.filter(m => m.period === "holdout May-Jun");
  return `<section id="model">
  <div class="sec-head"><div class="q">Model and validation</div><h2>A daily coin-in forecast, frozen on April 30</h2>
  <p class="lede">One simple time-series model, compared honestly with the required baseline on a time-based holdout. It changes one decision: how the July promotion is bought and judged.</p></div>
  <div class="grid g2">
    <div class="panel"><h3>How it was validated</h3>
      <ol class="steps">
        <li><span><b>Choose on April only.</b> Five candidates were fit on Jan–Mar and scored on April. <span class="mono">${esc(p.chosen_model)}</span> won (April MAE ${fmtK(selT[0].mae)}).</span></li>
        <li><span><b>Freeze.</b> The winner and the constant-mean baseline were refit on Jan–Apr and frozen on ${esc(p.freeze_date)}. Events count only if announced by then, so the Locals Week (announced May 26) is invisible to it.</span></li>
        <li><span><b>Score once on May–June.</b> MAE ${fmtK(p.holdout_mae_model)} (${pct(p.holdout_mape_model, 1)} of a day's coin-in) vs. ${fmtK(p.holdout_mae_baseline)} for the baseline: ${pct(p.mae_improvement_vs_baseline, 0)} less error.</span></li>
        <li><span><b>Report what we did not use.</b> Post-hoc, a median-based variant would have scored better on the holdout. Switching now would leak the holdout into the choice, so the frozen model stands.</span></li>
      </ol></div>
    <div class="panel"><h3>Scores</h3><div class="tw"><table><thead><tr><th>Model</th><th>Period</th><th class="n">MAE</th><th class="n">MAPE</th><th class="n">Bias</th></tr></thead><tbody>
      ${met.map(m => `<tr><td class="mono small">${esc(m.model)}</td><td class="small">${esc(m.period)}</td><td class="n">${fmtK(m.mae)}</td><td class="n">${pct(m.mape, 1)}</td><td class="n">${fmtSigned(m.bias)}</td></tr>`).join("")}</tbody></table></div>
      <details><summary>April selection table (fit on Jan–Mar)</summary><div class="tw"><table><thead><tr><th>Candidate</th><th class="n">April MAE</th><th class="n">Bias</th></tr></thead><tbody>${selT.map(s => `<tr><td class="mono small">${esc(s.model)}</td><td class="n">${fmtK(s.mae)}</td><td class="n">${fmtSigned(s.bias)}</td></tr>`).join("")}</tbody></table></div></details></div>
  </div>
  <div class="panel" style="margin-top:16px"><h3>Forecast against actuals</h3><div class="sub">Shaded: April validation and the May–June holdout; July is the frozen forecast with its 80% band (measured on the holdout).</div>
    ${legend([{ label: "Actual", color: "--s1", line: true }, { label: "Frozen forecast", color: "--s2", line: true }, { label: "Baseline (constant mean)", color: "--muted", line: true }])}
    ${lineChart("forecast", { x, series: [{ name: "Actual", color: "--s1", values: fc.map(r => r.actual_coin_in_usd) }, { name: "Forecast", color: "--s2", values: fc.map(r => r.model_coin_in_usd), band: [fc.map(r => r.split.startsWith("forecast") ? r.lower_80_usd : null), fc.map(r => r.split.startsWith("forecast") ? r.upper_80_usd : null)], width: 1.5 }, { name: "Baseline", color: "--muted", values: fc.map(r => r.baseline_coin_in_usd), width: 1.5 }], bands: [{ from: "2025-04-01", to: "2025-04-30", color: "--rule", label: "validation" }, { from: "2025-05-01", to: "2025-06-30", color: "--brass-wash", label: "holdout" }, { from: "2025-07-01", to: "2025-07-30", color: "--rule", label: "July forecast" }], height: 280, label: "Daily coin-in, forecast vs actual" })}
    <div class="findings">
      <div class="finding"><b>The decision it changes.</b> On a normal weekend the frozen forecast misses by about ${pct(p.weekend_rmse_pct, 1)}, so a single promotion weekend can only be told apart from noise if it lifts play by ${pct(p.min_detectable_promo_lift, 0)} or more. The Winter Slot Tournament (+18%) would clear that; the Locals Week (+4%) would not. So the plan buys <b>one</b> tournament-style weekend, judges it against this forecast, and buys the second only if it clears ${pct(p.min_detectable_promo_lift, 0)}. Be clear about the odds: our base case (the average of the two property promotions, ${pct(avgLift, 0)}) sits right at that bar, so one weekend has roughly even odds of proving a lift that is really there. A result under the bar is reported as inconclusive, not as a failure.</div>
      <div class="finding">The forecast ran high in May–June (bias ${fmtSigned(hold.find(h => h.model === p.chosen_model).bias)} a day): demand softened, in line with June's citywide fall in visitors. July benefit estimates use the recent 8 weeks, not the Jan–Apr level, for this reason.</div>
    </div></div>
  </section>`;
}

function sectionPlan() {
  const plan = D.action_plan[0], opts = D.action_options;
  const chosen = opts.filter(o => o.recommended);
  const segC = ["--s1", "--s2", "--s3"];
  const maxV = Math.max(...opts.map(o => Math.max(o.benefit_high_usd, o.cost_usd)));
  const link = { "A-INSPECT": ["#machines", "M-1158"], "A-REPLACE-LEASE": ["#answer", "M-1200"], "A-PROMO": ["#model", null], "A-WAYFINDING": ["#demand", null], "A-TECH-SHIFT": ["#downtime", null], "A-PREVENTIVE": ["#downtime", null], "A-COMP-PILOT": ["#comps", null] };
  return `<section id="plan">
  <div class="sec-head"><div class="q">Question 6 · Which actions would we fund with $100,000?</div><h2>Fix the leak, replace the right ten, test one promotion</h2>
  <p class="lede">July 1–30, 2025. Cost follows the catalogue rule: quantity × (unit cost + daily cost × days after the lead time). Benefit is expected extra theo on the days left after the lead time, at the last eight weeks' run rate. Low and high show how wrong it could be.</p></div>
  <div class="panel"><h3>The budget</h3><div class="sub">${fmtUSD(plan.total_cost_usd)} committed across ${plan.action_types} action types; ${fmtUSD(plan.budget_kept_usd)} kept. Expected July benefit ${fmtK(plan.benefit_base_usd)} (range ${fmtK(plan.benefit_low_usd)} – ${fmtK(plan.benefit_high_usd)}).</div>
    ${legend([...chosen.map((o, i) => ({ label: o.name, color: segC[i] })), { label: "Kept", color: "--rule" }])}
    <div class="segbar" role="img" aria-label="Budget split">${chosen.map((o, i) => `<div style="flex:${o.cost_usd};background:var(${segC[i]})" data-tip="${esc(tipRows(o.name, [["Cost", fmtUSD(o.cost_usd)]]))}">${o.cost_usd >= 8000 ? fmtK(o.cost_usd) : ""}</div>`).join("")}<div style="flex:${plan.budget_kept_usd};background:var(--rule);color:var(--ink)" data-tip="${esc(tipRows("Kept", [["Amount", fmtUSD(plan.budget_kept_usd)]]))}">${fmtK(plan.budget_kept_usd)} kept</div></div>
  </div>
  <div class="grid g3" style="margin-top:16px">${chosen.map((o, i) => `<div class="panel" style="display:grid;gap:10px;align-content:start">
      <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:var(${segC[i]})"></span><span class="eyebrow">${esc(o.action_type_id)}</span></div>
      <h3>${esc(o.name)}</h3>
      <div class="kv"><div><span class="k">Quantity</span><span class="v">${o.quantity}</span></div><div><span class="k">Cost</span><span class="v">${fmtUSD(o.cost_usd)}</span></div><div><span class="k">Expected benefit</span><span class="v">${fmtK(o.benefit_base_usd)}</span></div><div><span class="k">Range</span><span class="v">${fmtK(o.benefit_low_usd)}–${fmtK(o.benefit_high_usd)}</span></div></div>
      <p class="small"><b>Targets.</b> <span class="mono">${esc(o.targets)}</span></p>
      <p class="small"><b>Evidence.</b> ${esc(o.evidence)}</p>
      <p class="small"><b>Assumption.</b> ${esc(o.assumption)}</p>
      <p class="small"><b>How we'll know.</b> ${esc(o.measurement)}</p>
      <a href="${link[o.action_type_id]?.[0] || "#plan"}" ${link[o.action_type_id]?.[1] ? `data-pick-go="${link[o.action_type_id][1]}"` : ""}>Trace the evidence</a>
    </div>`).join("")}</div>
  <div class="panel" style="margin-top:16px"><h3>Everything we priced</h3><div class="sub">Bar: low-to-high benefit, dot = expected, black tick = cost. An action is worth it when the dot sits right of the tick.</div>
    <div class="tw"><table><thead><tr><th>Action</th><th class="n">Qty</th><th class="n">Cost</th><th style="min-width:200px">Benefit vs. cost</th><th class="n">Expected net</th><th>Decision</th></tr></thead><tbody>
    ${opts.map(o => `<tr><td>${esc(o.name)}${o.action_type_id.includes("manager") ? '<div class="small muted">The manager\'s plan: lease replacements for the bottom 10</div>' : ""}<div class="small muted mono">${esc(o.targets.length > 60 ? o.targets.slice(0, 58) + "…" : o.targets)}</div></td>
      <td class="n">${o.quantity}</td><td class="n">${fmtK(o.cost_usd)}</td>
      <td><div class="opt-range" data-tip="${esc(tipRows(o.name, [["Low", fmtK(o.benefit_low_usd)], ["Expected", fmtK(o.benefit_base_usd)], ["High", fmtK(o.benefit_high_usd)], ["Cost", fmtK(o.cost_usd)]]))}"><span class="bar-r" style="left:${o.benefit_low_usd / maxV * 100}%;width:${Math.max(0.5, (o.benefit_high_usd - o.benefit_low_usd) / maxV * 100)}%"></span><span class="cost" style="left:${o.cost_usd / maxV * 100}%"></span><span class="base" style="left:${o.benefit_base_usd / maxV * 100}%"></span></div></td>
      <td class="n ${o.net_base_usd >= 0 ? "ok" : ""}">${fmtSigned(o.net_base_usd)}</td><td>${o.recommended ? '<span class="pill">Fund</span>' : '<span class="pill no">Skip</span>'}</td></tr>`).join("")}</tbody></table></div>
    <div class="findings">
      <div class="finding"><b>Why not the manager's plan?</b> Leasing new titles for the manager's list costs about the same but returns a third as much: two are already retired, one is 49 days old, one is a payout fault a new cabinet would not fix. The Back Forty six are weak for their spot too, but a new title only lifts them to Back Forty's par, which is worth less than half what the same lease earns in a busy zone.</div>
      <div class="finding"><b>Runner-up: Back Forty signage.</b> The walkway closure proves Back Forty play follows foot traffic, and signage breaks even at a 2.8% lift. It loses its slot only because its uplift is an assumption, while the promotion's is observed twice.</div>
      <div class="finding"><b>Not funded:</b> an extra grave technician (−$10.6K net) and the Ridgeline sweep (−$3.4K net, no maintenance history to calibrate). The comp pilot is the right next step once the slot frees up.</div>
    </div></div>
  </section>`;
}

function sectionPipeline() {
  const exp = D.expectations;
  // consistency check: browser recomputation vs. pipeline scorecard for the full period
  const full = computeScorecard(0, NDAYS - 1);
  let maxGap = 0, maxFi = 0, mism = 0;
  full.rows.forEach(s => { const q = D.sqlScore[s.machine_id]; if (!q) return; maxGap = Math.max(maxGap, Math.abs(q.gap_usd - s.gap_usd)); maxFi = Math.max(maxFi, Math.abs(q.fair_index - s.fair_index)); if (q.verdict !== s.verdict) mism++; });
  const layers = [
    ["Bronze · Auto Loader", ["22 streaming tables, one per release file", "_source_file + _ingested_at lineage", "Unity Catalog volume /raw"]],
    ["Silver · conformed", ["silver_machine_day (off-floor days dropped)", "silver_machine_hour", "silver_operations (gaming day, shift)", "silver_redemptions, silver_player_period", "silver_property_day (+ NOAA weather)"]],
    ["Gold · decisions", ["gold_machine_scorecard (verdicts)", "gold_machine_day_components", "gold_downtime_lost, gold_repair_response", "gold_natural_experiments, gold_event_lift", "gold_comp_change_test, gold_player_concentration", "gold_action_options, gold_action_plan"]],
    ["ML · MLflow + UC", ["5 candidate runs, April selection", "floor_coin_in_forecast @champion", "gold_forecast (+ July plan)"]],
  ];
  return `<section id="pipeline">
  <div class="sec-head"><div class="q">How this was built</div><h2>A Databricks lakehouse behind every number</h2>
  <p class="lede">A Lakeflow declarative pipeline (bronze → silver → gold) with data-quality expectations, an MLflow-tracked forecast registered in Unity Catalog, and one export that feeds this page. The same SQL files also run locally on DuckDB for verification.</p></div>
  <div class="lineage">${layers.map(([h, items]) => `<div class="layer"><h4>${esc(h)}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><h3>Data-quality expectations</h3><div class="sub">Every common mistake from the challenge guide is a rule the pipeline enforces. Drop = row removed; fail = the update stops.</div>
      <div class="tw"><table><thead><tr><th>Table · rule</th><th>On violation</th><th class="n">Rows checked</th><th class="n">Failed</th></tr></thead><tbody>
      ${exp.map(e => `<tr><td class="mono small">${esc(e.dataset)}<div>${esc(e.expectation)}</div></td><td>${esc(e.action)}</td><td class="n">${n0(e.rows_in)}</td><td class="n">${e.rows_failed ? `<b>${n0(e.rows_failed)}</b>` : "0"}</td></tr>`).join("")}</tbody></table></div>
      <p class="src">The 1,018 dropped rows are machine-days before install or after retirement: not zero sales.</p></div>
    <div class="panel"><h3>Same maths in two places</h3><div class="sub">This page recomputes the scorecard in your browser for whatever period you pick. For the full period it must match the pipeline's gold table.</div>
      <div class="kv"><div><span class="k">Largest gap difference</span><span class="v ${maxGap < 1 ? "ok" : "flag"}">${fmtUSD(maxGap, 2)}</span></div><div><span class="k">Largest fair-index difference</span><span class="v ${maxFi < 1e-6 ? "ok" : "flag"}">${maxFi.toExponential(1)}</span></div><div><span class="k">Verdicts that differ</span><span class="v ${mism === 0 ? "ok" : "flag"}">${mism} of ${full.rows.length}</span></div></div>
      <div class="findings">
        <div class="finding">Luck test: Var(house win) = Σ bet² × Var(payout ÷ bet), with the variance taken from the published game math, so z = (house win − theo) ÷ √Var. The normal approximation is weakest for Jackpot Summit (very high volatility) and on short windows, where one jackpot skews the sum; so the luck test only flags a machine over 150+ days, while the hit-rate test (binomial, robust on any window) always applies.</div>
        <div class="finding">Fair index: theo ÷ what same-zone machines earned on the same days per available second, with a ratio-estimator 95% interval across days.</div>
      </div></div>
  </div>
  </section>`;
}

/* ============================== render & events ============================== */
function render() {
  sc = computeScorecard(S.a, S.b);
  const y = scrollY;
  $("#app").innerHTML = sectionAnswer() + sectionMachines() + sectionDemand() + sectionDowntime() + sectionPlayers() + sectionComps() + sectionModel() + sectionPlan() + sectionPipeline() +
    `<footer><p>The Gilded Ace is fictional and all of its data is synthetic (Dashboard Royale release ${esc(D.meta.window.join(" → "))}). Only the LVCVA, NOAA and Missouri Gaming Commission files are real public data. Unusual payouts are leads to inspect, never accusations. Built with Databricks (Lakeflow, Unity Catalog, MLflow). AI assistance disclosed in the write-up.</p><p style="margin-top:6px">Data exported ${esc(D.meta.generated_at)}.</p></footer>`;
  scrollTo(0, y);
  syncPeriodControls();
}
function rerenderMachine() { const el = $("#machine-detail"); if (el) el.innerHTML = machineDetail(); document.querySelectorAll("[data-pick]").forEach(el => { const sel = el.dataset.pick === S.sel; if (el.tagName === "TR") el.classList.toggle("sel", sel); }); }

const PRESETS = [["Full half-year", "2025-01-01", "2025-06-30"], ["Jan–Apr (training)", "2025-01-01", "2025-04-30"], ["May–Jun (holdout)", "2025-05-01", "2025-06-30"], ["Walkway closure", "2025-03-03", "2025-04-06"], ["June", "2025-06-01", "2025-06-30"]];
function syncPeriodControls() {
  const s = $("#p-start"), e = $("#p-end");
  s.min = e.min = CAL[0]; s.max = e.max = CAL[NDAYS - 1]; s.value = CAL[S.a]; e.value = CAL[S.b];
  $("#presets").innerHTML = PRESETS.map(([l, a, b]) => `<button type="button" data-preset="${a}|${b}" aria-pressed="${CAL[S.a] === a && CAL[S.b] === b}">${l}</button>`).join("");
}
function setPeriod(a, b) {
  let ia = CAL.indexOf(a), ib = CAL.indexOf(b); if (ia < 0) ia = 0; if (ib < 0) ib = NDAYS - 1; if (ib < ia) [ia, ib] = [ib, ia];
  if (ib - ia < 6) ib = Math.min(NDAYS - 1, ia + 6);
  S.a = ia; S.b = ib; try { localStorage.setItem("ga-period", `${CAL[ia]}|${CAL[ib]}`); } catch (e) { /* storage unavailable */ }
  render();
}

document.addEventListener("click", e => {
  const pr = e.target.closest("[data-preset]"); if (pr) { const [a, b] = pr.dataset.preset.split("|"); setPeriod(a, b); return; }
  const go = e.target.closest("[data-pick-go]"); if (go) { S.sel = go.dataset.pickGo; rerenderMachine(); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { S.sel = pk.dataset.pick; rerenderMachine(); $("#machine-detail")?.scrollIntoView({ block: "nearest" }); return; }
  const so = e.target.closest("[data-sort]"); if (so) { const k = so.dataset.sort; if (S.sort === k) S.asc = !S.asc; else { S.sort = k; S.asc = true; } render(); return; }
  if (e.target.id === "show-all") { S.showAll = !S.showAll; render(); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-pick]")) { e.preventDefault(); S.sel = e.target.dataset.pick; rerenderMachine(); } });
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "p-start" || id === "p-end") setPeriod($("#p-start").value, $("#p-end").value);
  else if (id === "f-zone") { S.zone = e.target.value; S.bank = "all"; render(); }
  else if (id === "f-bank") { S.bank = e.target.value; render(); }
  else if (id === "f-tier") { S.tier = e.target.value; render(); }
  else if (id === "f-age") { S.age = e.target.value; render(); }
  else if (id === "f-region") { S.region = e.target.value; render(); }
});
$("#theme-btn").addEventListener("click", () => {
  const root = document.documentElement, cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark"; try { localStorage.setItem("ga-theme", root.dataset.theme); } catch (e) { /* ignore */ }
});
try { const t = localStorage.getItem("ga-theme"); if (t && !document.documentElement.dataset.theme) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }

fetch("data/gilded_ace.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  D = data; prep();
  S.b = NDAYS - 1;
  try { const p = localStorage.getItem("ga-period"); if (p) { const [a, b] = p.split("|"); const ia = CAL.indexOf(a), ib = CAL.indexOf(b); if (ia >= 0 && ib > ia) { S.a = ia; S.b = ib; } } } catch (e) { /* ignore */ }
  render();
}).catch(err => { $("#app").innerHTML = `<div class="loading">Couldn't load data/gilded_ace.json (${esc(err.message)}). Serve this folder over HTTP, for example <span class="mono">python -m http.server</span> inside dashboard/, then reload.</div>`; });
</script>

</body>
</html>
