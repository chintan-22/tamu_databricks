<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Luck, Location, or a Leak?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Floor analytics for The Gilded Ace (fictional): which slot machines are truly underperforming once luck, location and downtime are accounted for, and how to spend $100,000.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a floor-analytics console. Sticky period bar, then the manager's question answered first,
   then one section per challenge question, each ending in the evidence it hands to the plan. */
:root {
  --page: #f4f4f0;          /* felt-free paper, faint green-grey bias */
  --surface: #fcfcfb;       /* chart surface (validated) */
  --ink: #0f1412;
  --ink-2: #4c524e;
  --muted: #858b86;
  --rule: #e1e2dc;
  --axis: #c3c4bc;
  --brass: #8a5a00;         /* the gilded accent: links, focus, the selected machine */
  --brass-wash: #f3e7cc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300;
  --div-neg: #e34948; --div-mid: #e6e5e0; --div-pos: #2a78d6;
  --ring: rgba(15, 20, 18, .10);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e100f; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f948f;
    --rule: #2c2c2a; --axis: #3a3a37; --brass: #e0b25a; --brass-wash: #3a2f19;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-text: #0ca30c; --div-neg: #e66767; --div-mid: #383835; --div-pos: #3987e5; --ring: rgba(255,255,255,.10);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e100f; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f948f;
  --rule: #2c2c2a; --axis: #3a3a37; --brass: #e0b25a; --brass-wash: #3a2f19;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-text: #0ca30c; --div-neg: #e66767; --div-mid: #383835; --div-pos: #3987e5; --ring: rgba(255,255,255,.10);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { background: var(--page); color: var(--ink); font: 400 15px/1.55 var(--font-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--brass); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; line-height: 1.05; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.3rem, 5vw, 3.6rem); font-weight: 800; }
h2 { font-size: clamp(1.7rem, 3vw, 2.2rem); }
h3 { font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font: 500 11.5px/1.2 var(--font-data); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.num, td.n, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }

/* sticky period bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { font: 800 20px/1 var(--font-display); letter-spacing: .03em; white-space: nowrap; }
.brand span { color: var(--brass); }
.period { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.period label { font-size: 12px; color: var(--ink-2); }
input[type=date], select { font: 500 13px var(--font-data); color: var(--ink); background: var(--page); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 7px; min-height: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 500 12.5px var(--font-body); color: var(--ink); background: var(--page); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 11px; cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--axis); }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.nav { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 13px; margin-left: auto; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--ink); border-color: var(--brass); }
.theme-btn { border-radius: 4px; }

/* sections */
section { padding-block: 44px 8px; }
.sec-head { display: grid; gap: 8px; margin-bottom: 18px; }
.sec-head .q { font: 500 12px var(--font-data); color: var(--brass); letter-spacing: .1em; text-transform: uppercase; }
.lede { font-size: 16.5px; color: var(--ink-2); max-width: 74ch; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel > h3 { margin-bottom: 4px; }
.panel > .sub { font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
.finding { border-left: 3px solid var(--brass); padding: 2px 0 2px 12px; font-size: 14.5px; }
.finding b { font-weight: 600; }
.findings { display: grid; gap: 10px; margin-top: 14px; }
.src { font: 400 11.5px var(--font-data); color: var(--muted); margin-top: 10px; }

/* hero */
.hero { padding-block: 40px 10px; display: grid; gap: 22px; }
.hero .verdict-line { font-size: clamp(17px, 2vw, 20px); color: var(--ink-2); max-width: 62ch; }
.hero-num { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero-num .big { font: 800 clamp(64px, 9vw, 104px)/.9 var(--font-display); color: var(--ink); }
.hero-num .cap { font-size: 16px; color: var(--ink-2); max-width: 34ch; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.tile .l { font-size: 12.5px; color: var(--ink-2); }
.tile .v { font: 600 24px/1.1 var(--font-body); }
.tile .d { font-size: 12px; color: var(--muted); }

/* tables */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { font: 500 11.5px var(--font-data); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
th.n, td.n { text-align: right; }
td { padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--brass-wash); }
tr.sel td { background: var(--brass-wash); }
th button.sort { all: unset; cursor: pointer; }
th button.sort:focus-visible { outline: 2px solid var(--brass); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--page); border: 1px solid var(--rule); }
td .chip { white-space: normal; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.chip.leak { border-color: var(--critical); }
.chip.leak svg { flex: none; }
.pill { font: 500 11px var(--font-data); letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--ink); color: var(--surface); }
.pill.no { background: transparent; color: var(--muted); border: 1px solid var(--rule); }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 400 11px var(--font-data); }
.chart .lbl { fill: var(--ink-2); font: 500 11px var(--font-body); }
.grid-line { stroke: var(--rule); stroke-width: 1; }
.axis-line { stroke: var(--axis); stroke-width: 1; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(0,0,0,.16); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; max-width: 280px; display: none; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* horizontal bars */
.hbars { display: grid; gap: 7px; }
.hb { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hb .track { position: relative; height: 14px; }
.hb .fill { position: absolute; top: 1px; height: 12px; border-radius: 0 4px 4px 0; }
.hb .fill.neg { border-radius: 4px 0 0 4px; }
.hb .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.hb .val { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 70px; text-align: right; }

/* decomposition mini bar (diverging stacked) */
.mini { position: relative; height: 12px; min-width: 160px; }
.mini .seg { position: absolute; top: 0; height: 12px; }
.mini .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); }

/* segmented bar */
.segbar { display: flex; gap: 2px; height: 28px; }
.segbar > div { border-radius: 4px; color: #fff; font: 600 12px/28px var(--font-body); padding-left: 7px; white-space: nowrap; overflow: hidden; min-width: 2px; }
.segbar > div.dark-ink { color: #0b0b0b; }

/* machine detail */
.detail { display: grid; gap: 14px; }
.detail .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.detail .mid { font: 800 30px/1 var(--font-display); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.kv div { display: grid; gap: 2px; }
.kv .k { font-size: 12px; color: var(--ink-2); }
.kv .v { font: 500 16px var(--font-data); font-variant-numeric: tabular-nums; }

/* plan */
.opt-range { position: relative; height: 18px; min-width: 180px; }
.opt-range .bar-r { position: absolute; top: 7px; height: 4px; border-radius: 2px; background: var(--s1); opacity: .35; }
.opt-range .base { position: absolute; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--s1); box-shadow: 0 0 0 2px var(--surface); margin-left: -5px; }
.opt-range .cost { position: absolute; top: 0; height: 18px; width: 2px; background: var(--ink); margin-left: -1px; }
details { border-top: 1px solid var(--rule); padding-block: 8px; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
details[open] summary { margin-bottom: 8px; }
.steps { display: grid; gap: 10px; counter-reset: step; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14px; }
.steps li::before { counter-increment: step; content: counter(step); font: 600 13px/26px var(--font-data); text-align: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--axis); color: var(--ink-2); }

/* lineage */
.lineage { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.layer { border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px; background: var(--surface); }
.layer h4 { margin: 0 0 6px; font: 600 13px var(--font-data); text-transform: uppercase; letter-spacing: .08em; }
.layer ul { margin: 0; padding-left: 16px; font: 400 12px/1.6 var(--font-data); color: var(--ink-2); }
footer { padding-block: 40px 60px; color: var(--muted); font-size: 12.5px; }
.loading { padding: 80px 0; text-align: center; color: var(--muted); }
.ok { color: var(--good-text); font-weight: 600; }
.flag { color: var(--critical); font-weight: 600; }
@media (max-width: 720px) {
  .nav { display: none; }
  .hb { grid-template-columns: minmax(80px, 38%) 1fr auto; }
}
</style>
</head>
<body>


<div class="bar">
  <div class="wrap">
    <div class="brand">THE GILDED <span>ACE</span></div>
    <div class="period" role="group" aria-label="Analysis period">
      <label for="p-start">From</label><input type="date" id="p-start">
      <label for="p-end">to</label><input type="date" id="p-end">
      <div class="chips" id="presets"></div>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#answer">Answer</a><a href="#machines">Machines</a><a href="#demand">Demand</a><a href="#downtime">Downtime</a>
      <a href="#players">Players</a><a href="#comps">Comps</a><a href="#model">Model</a><a href="#plan">Plan</a><a href="#pipeline">Pipeline</a>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme">Theme</button>
  </div>
</div>

<main class="wrap" id="app"><div class="loading">Loading the floor data…</div></main>
<div class="tip" id="tip" role="status"></div>

<script>
"use strict";
/* ============================== utilities ============================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtUSD = (v, d = 0) => v == null || isNaN(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtK = v => { if (v == null || isNaN(v)) return "–"; const a = Math.abs(v), s = v < 0 ? "−" : ""; if (a >= 1e6) return s + "$" + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M"; if (a >= 1e3) return s + "$" + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "K"; return s + "$" + a.toFixed(0); };
const fmtSigned = v => (v > 0 ? "+" : "") + fmtK(v);
const pct = (v, d = 1) => v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%";
const spct = (v, d = 1) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
const n0 = v => v == null || isNaN(v) ? "–" : Math.round(v).toLocaleString("en-US");
const f2 = v => v == null || isNaN(v) ? "–" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
const sum = a => a.reduce((s, x) => s + (x || 0), 0);
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul"];
const monthLabel = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const shortDate = iso => { const [y, m, d] = iso.split("-"); return MONTHS[+m - 1] + " " + (+d); };

/* fixed colour assignment: the six explanations always wear the same slot */
const CAUSES = [
  { key: "luck", label: "Luck", color: "--s1" },
  { key: "location", label: "Location", color: "--s2" },
  { key: "downtime", label: "Downtime", color: "--s3" },
  { key: "appeal", label: "Game appeal", color: "--s4" },
  { key: "hold_setting", label: "Hold setting", color: "--s5" },
  { key: "exposure", label: "Time on floor", color: "--s6" },
];
const VERDICT_STYLE = {
  "Leak? Inspect payout": { color: "--critical", leak: true },
  "Already retired": { color: "--s6" },
  "New install (short exposure)": { color: "--s6" },
  "Weak earner: low-hold game": { color: "--s5" },
  "Weak earner: low play": { color: "--s4" },
  "Unlucky": { color: "--s1" },
  "Quiet location": { color: "--s2" },
  "Downtime": { color: "--s3" },
  "At or near par": { color: "--axis" },
};
const warnIcon = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11.5 11h-11z" fill="var(--critical)"/><rect x="5.3" y="4.4" width="1.4" height="3.6" fill="#fff"/><rect x="5.3" y="8.8" width="1.4" height="1.3" fill="#fff"/></svg>';
function verdictChip(v) {
  const st = VERDICT_STYLE[v] || { color: "--axis" };
  return `<span class="chip${st.leak ? " leak" : ""}">${st.leak ? warnIcon : `<span class="dot" style="background:var(${st.color})"></span>`}${esc(v)}</span>`;
}

/* ============================== tooltip ============================== */
const tip = $("#tip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
document.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); });
document.addEventListener("pointerout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("scroll", hideTip, { passive: true });
const tipRows = (title, rows) => `<b>${esc(title)}</b>` + rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span>${v}</span></div>`).join("");

/* ============================== SVG chart kit ============================== */
function niceTicks(min, max, count = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= count) || 10 * mag;
  const ticks = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}
const lineRegistry = {};
/* line chart: x is an array of ISO dates; series [{name, color, values, width, band:[lo,hi]}]; bands = shaded date ranges */
function lineChart(id, { x, series, yfmt = fmtK, height = 240, bands = [], yMin = null, marks = [], label = "" }) {
  const W = 760, H = height, L = 56, R = 16, T = 22, B = 26;
  const all = series.flatMap(s => [...s.values, ...(s.band ? [...s.band[0], ...s.band[1]] : [])]).filter(v => v != null && !isNaN(v));
  let lo = yMin ?? Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08; if (yMin == null) lo -= pad; hi += pad;
  const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const n = x.length, sx = i => L + (n === 1 ? 0 : i / (n - 1)) * (W - L - R), sy = v => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  let g = "";
  bands.forEach(b => {
    const i0 = x.indexOf(b.from), i1 = x.indexOf(b.to);
    if (i0 < 0 && i1 < 0) return;
    const a0 = sx(Math.max(0, i0 < 0 ? 0 : i0)) - (n > 1 ? (W - L - R) / (n - 1) / 2 : 0), a1 = sx(i1 < 0 ? n - 1 : i1) + (n > 1 ? (W - L - R) / (n - 1) / 2 : 0);
    g += `<rect x="${Math.max(L, a0).toFixed(1)}" y="${T}" width="${Math.max(1, Math.min(W - R, a1) - Math.max(L, a0)).toFixed(1)}" height="${H - T - B}" fill="var(${b.color || "--brass-wash"})" opacity="${b.opacity ?? 0.7}"/>`;
    if (b.label) g += `<text x="${(Math.max(L, a0) + 3).toFixed(1)}" y="${T - 6}" class="lbl">${esc(b.label)}</text>`;
  });
  ticks.forEach(t => { const y = sy(t).toFixed(1); g += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${+y + 4}" text-anchor="end">${esc(yfmt(t))}</text>`; });
  g += `<line class="axis-line" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  // month ticks
  let lastM = "";
  x.forEach((d, i) => { const m = d.slice(0, 7); if (m !== lastM) { lastM = m; const xx = sx(i).toFixed(1); g += `<line class="axis-line" x1="${xx}" x2="${xx}" y1="${H - B}" y2="${H - B + 4}"/><text x="${xx}" y="${H - 8}" text-anchor="start">${MONTHS[+d.slice(5, 7) - 1]}</text>`; } });
  series.forEach(s => {
    if (s.band) {
      let top = "", bot = "";
      s.band[1].forEach((v, i) => { if (v != null) top += `${top ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; });
      for (let i = s.band[0].length - 1; i >= 0; i--) { const v = s.band[0][i]; if (v != null) bot += `L${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; }
      if (top) g += `<path d="${top}${bot}Z" fill="var(${s.color})" opacity=".12" stroke="none"/>`;
    }
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null || isNaN(v)) { pen = false; return; } d += `${pen ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; pen = true; });
    g += `<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/>`;
    if (s.endLabel) { let i = s.values.length - 1; while (i > 0 && (s.values[i] == null)) i--; g += `<circle cx="${sx(i).toFixed(1)}" cy="${sy(s.values[i]).toFixed(1)}" r="4" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2"/>`; }
  });
  marks.forEach(m => { const i = x.indexOf(m.date); if (i < 0) return; const xx = sx(i).toFixed(1); g += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1"/><text x="${+xx + 4}" y="${T + 10}" class="lbl">${esc(m.label)}</text>`; });
  g += `<line class="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>`;
  series.forEach((s, k) => { g += `<circle class="xdot" data-k="${k}" r="4" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`; });
  g += `<rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  lineRegistry[id] = { x, series, sx, sy, W, L, R, yfmt };
  return `<div class="chart" data-line="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg></div>`;
}
document.addEventListener("pointermove", e => {

  const n = reg.x.length; let i = Math.round((vx - reg.L) / (reg.W - reg.L - reg.R) * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
  const xh = svg.querySelector(".xhair"); xh.setAttribute("x1", reg.sx(i)); xh.setAttribute("x2", reg.sx(i)); xh.setAttribute("visibility", "visible");

  const rows = reg.series.filter(s => !s.noTip).map(s => [s.name, s.values[i] == null ? "–" : reg.yfmt(s.values[i])]);
  showTip(tipRows(new Date(reg.x[i] + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }), rows), e.clientX, e.clientY);
});

function legend(items) { return `<div class="legend">${items.map(i => `<span><span class="${i.line ? "key-line" : "dot"}" style="background:var(${i.color})"></span>${esc(i.label)}</span>`).join("")}</div>`; }

/* horizontal bars, single series or diverging around zero */
function hbars(rows, { fmt = fmtK, color = "--s1", colorOf = null, max = null } = {}) {
  const vals = rows.map(r => r.value), mx = max ?? Math.max(...vals.map(Math.abs), 1e-9);
  const hasNeg = vals.some(v => v < 0), zero = hasNeg ? 50 : 0, span = hasNeg ? 50 : 100;
  return `<div class="hbars">${rows.map(r => {
    const w = Math.abs(r.value) / mx * span, c = colorOf ? colorOf(r) : color;
    const left = r.value < 0 ? zero - w : zero;
    return `<div class="hb" data-tip="${esc(r.tip || `<b>${esc(r.label)}</b><div class="row"><span>value</span><span>${fmt(r.value)}</span></div>`)}"><span>${r.labelHtml || esc(r.label)}</span><span class="track">${hasNeg ? `<span class="zero" style="left:${zero}%"></span>` : ""}<span class="fill${r.value < 0 ? " neg" : ""}" style="left:${left}%;width:${Math.max(w, 0.4)}%;background:var(${c})"></span></span><span class="val">${fmt(r.value)}</span></div>`;
  }).join("")}</div>`;
}

/* diverging stacked mini bar of the six components */
function miniDecomp(s, scale) {
  let pos = 50, neg = 50, html = `<span class="zero" style="left:50%"></span>`;
  const tipHtml = tipRows(s.machine_id + " — gap vs. a typical machine " + fmtSigned(s.gap_usd), CAUSES.map(c => [c.label, fmtSigned(s[c.key + "_usd"])]));
  CAUSES.forEach(c => {
    const v = s[c.key + "_usd"], w = Math.abs(v) / scale * 50; if (w < 0.15) return;
    if (v >= 0) { html += `<span class="seg" style="left:${pos}%;width:${w}%;background:var(${c.color})"></span>`; pos += w + 0.3; }
    else { neg -= w; html += `<span class="seg" style="left:${neg}%;width:${w}%;background:var(${c.color})"></span>`; neg -= 0.3; }

  return `<div class="mini" data-tip="${esc(tipHtml)}" aria-label="decomposition">${html}</div>`;

/* ============================== state & data ============================== */
let D, CAL, NDAYS, sc = null;
const S = { a: 0, b: 180, zone: "all", bank: "all", sel: "M-1158", sort: "fair_index", asc: true, showAll: false, tier: "all", age: "all", region: "all" };

function prep() {
  CAL = D.calendar.gaming_date.map(d => String(d).slice(0, 10)); NDAYS = CAL.length;
  const M = D.machines, L = D.locations, md = D.machine_day;
  D.zones = [...new Set(L.zone_id)].sort();
  D.zoneName = {}; L.zone_id.forEach((z, i) => D.zoneName[z] = L.zone_name[i]);
  D.locZone = L.zone_id.map(z => D.zones.indexOf(z));
  D.rtp = M.rtp; D.rows = md.m.length;
  D.byMachine = M.machine_id.map(() => []);
  for (let r = 0; r < D.rows; r++) D.byMachine[md.m[r]].push(r);
  D.mIndex = {}; M.machine_id.forEach((id, i) => D.mIndex[id] = i);
  D.sqlScore = {}; D.scorecard.forEach(s => D.sqlScore[s.machine_id] = s);
}

/* The whole scorecard, recomputed in the browser for the chosen period. Same maths as
   src/pipeline/gold_machines.sql; for the full period the two agree (see Pipeline section). */
function computeScorecard(a, b) {
  const md = D.machine_day, M = D.machines, L = D.locations, nZ = D.zones.length, nD = b - a + 1;
  const zk = (z, d) => z * NDAYS + d;
  const Z = { n: new Float64Array(nZ * NDAYS), ci: new Float64Array(nZ * NDAYS), th: new Float64Array(nZ * NDAYS), av: new Float64Array(nZ * NDAYS), sc: new Float64Array(nZ * NDAYS), dn: new Float64Array(nZ * NDAYS) };
  const Fn = new Float64Array(NDAYS), Fth = new Float64Array(NDAYS);
  const nM = M.machine_id.length, mci = new Float64Array(nM), mav = new Float64Array(nM);
  let floorHW = 0, floorRows = 0;
  for (let r = 0; r < D.rows; r++) {
    const d = md.d[r]; if (d < a || d > b) continue;
    const m = md.m[r], z = D.locZone[md.l[r]], k = zk(z, d), ci = md.ci[r], th = ci * (1 - D.rtp[m]);
    Z.n[k]++; Z.ci[k] += ci; Z.th[k] += th; Z.av[k] += md.av[r]; Z.sc[k] += md.av[r] + md.dn[r]; Z.dn[k] += md.dn[r];
    Fn[d]++; Fth[d] += th; floorHW += md.hw[r]; floorRows++; mci[m] += ci; mav[m] += md.av[r];
  }
  const Hf = floorRows ? floorHW / floorRows : 0;
  const out = [];
  for (let m = 0; m < nM; m++) {
    const rows = D.byMachine[m].filter(r => md.d[r] >= a && md.d[r] <= b);
    if (!rows.length) continue;
    const rate = mav[m] ? mci[m] / mav[m] : 0;
    let hw = 0, th = 0, ci = 0, vr = 0, sp = 0, hi = 0, av = 0, dn = 0, oc = 0, f = 0;
    let luck = 0, loc = 0, hold = 0, down = 0, appeal = 0, fth = 0, exp = 0, expCi = 0;
    const thArr = [], expArr = [];
    let lastL = md.l[rows[rows.length - 1]];
    const zonesSeen = new Set();
    for (const r of rows) {
      const d = md.d[r], z = D.locZone[md.l[r]], k = zk(z, d);
      const c = md.ci[r], t = c * (1 - D.rtp[m]), hz = Z.ci[k] ? Z.th[k] / Z.ci[k] : 0;
      const excess = md.dn[r] - (md.av[r] + md.dn[r]) * (Z.sc[k] ? Z.dn[k] / Z.sc[k] : 0);
      hw += md.hw[r]; th += t; ci += c; vr += md.vr[r]; sp += md.sp[r]; hi += md.hi[r]; av += md.av[r]; dn += md.dn[r]; oc += md.oc[r]; f += md.f[r];
      luck += md.hw[r] - t;
      loc += Z.th[k] / Z.n[k] - Fth[d] / Fn[d];
      hold += t - c * hz;
      down += -excess * rate * hz;
      appeal += (c - Z.ci[k] / Z.n[k]) * hz + excess * rate * hz;
      fth += Fth[d] / Fn[d];
      const e = Z.av[k] ? md.av[r] * Z.th[k] / Z.av[k] : 0; exp += e; thArr.push(t); expArr.push(e);
      expCi += Z.av[k] ? md.av[r] * Z.ci[k] / Z.av[k] : 0;
      zonesSeen.add(z);
    }
    const fi = exp ? th / exp : null;
    let ss = 0; for (let i = 0; i < thArr.length; i++) { const res = thArr[i] - expArr[i] * fi; ss += res * res; }
    const nn = thArr.length, se = nn > 1 && exp ? Math.sqrt(ss / (nn - 1)) / ((exp / nn) * Math.sqrt(nn)) : null;
    const p = M.spec_hit[m];
    const rec = {
      machine_id: M.machine_id[m], m, theme: M.theme[m], manufacturer: M.manufacturer[m], lease_class: M.lease_class[m],
      retire_date: M.retire_date[m], install_date: M.install_date[m], rtp: D.rtp[m], volatility_class: M.volatility_class[m],
      location_id: L.location_id[lastL], bank_id: L.bank_id[lastL], zone_id: L.zone_id[lastL], zone_name: L.zone_name[lastL], x: L.x_m[lastL], y: L.y_m[lastL],
      days_on_floor: nn, house_win_usd: hw / 100, theo_usd: th / 100, coin_in_usd: ci / 100,
      observed_hold: ci ? hw / ci : null, theo_hold: 1 - D.rtp[m],
      luck_usd: luck / 100, location_usd: loc / 100, hold_setting_usd: hold / 100, downtime_usd: down / 100, appeal_usd: appeal / 100,
      exposure_usd: fth / 100 - nD * Hf / 100, gap_usd: hw / 100 - nD * Hf / 100, typical_usd: nD * Hf / 100,
      luck_z: vr ? (hw - th) / Math.sqrt(vr) : null,
      hit_rate_z: sp ? (hi - sp * p) / Math.sqrt(sp * p * (1 - p)) : null, observed_hit_rate: sp ? hi / sp : null, spec_hit: p,
      fair_index: fi, fair_index_se: se, demand_index: expCi ? ci / expCi : null,
      availability: (av + dn) ? av / (av + dn) : null, occupancy: av ? oc / av : null, downtime_hours: dn / 3600, faults: f,
      luck_sd_usd: Math.sqrt(vr) / 100, zones_occupied: zonesSeen.size,
    };
    rec.verdict = verdictOf(rec, nD, CAL[b]);
    out.push(rec);
  }
  const byHW = [...out].sort((x, y) => x.house_win_usd - y.house_win_usd); byHW.forEach((s, i) => s.manager_rank = i + 1);
  const byFI = [...out].sort((x, y) => x.fair_index - y.fair_index); byFI.forEach((s, i) => s.fair_rank = i + 1);
  return { rows: out, nDays: nD, typical: nD * Hf / 100, by: Object.fromEntries(out.map(s => [s.machine_id, s])) };
}
function verdictOf(s, nD, endDate) {
  const hiCI = s.fair_index + 1.96 * (s.fair_index_se || 0);
  // luck z only counts on 150+ days: on short windows one jackpot pushes honest machines past -3.6 (same rule as gold_machines.sql)
  if (Math.abs(s.hit_rate_z) > 6 || (s.luck_z < -3.6 && s.days_on_floor >= 150)) return "Leak? Inspect payout";
  if (s.retire_date && s.retire_date <= endDate) return "Already retired";
  if (s.days_on_floor < 150 * nD / 181) return "New install (short exposure)";
  if (hiCI < 0.85 && s.hold_setting_usd < s.appeal_usd) return "Weak earner: low-hold game";
  if (hiCI < 0.85) return "Weak earner: low play";
  if (s.luck_usd < 0 && s.luck_usd <= Math.min(s.location_usd, s.downtime_usd, s.appeal_usd, s.hold_setting_usd)) return "Unlucky";
  if (s.location_usd < 0 && s.location_usd <= Math.min(s.downtime_usd, s.appeal_usd, s.hold_setting_usd)) return "Quiet location";
  if (s.downtime_usd < 0 && s.downtime_usd <= Math.min(s.appeal_usd, s.hold_setting_usd)) return "Downtime";
  return "At or near par";
}
const inPeriod = iso => iso >= CAL[S.a] && iso <= CAL[S.b];
const monthsInPeriod = () => { const a = CAL[S.a].slice(0, 7), b = CAL[S.b].slice(0, 7); return [...new Set(CAL.map(d => d.slice(0, 7)))].filter(m => m >= a && m <= b); };
const periodLabel = () => `${shortDate(CAL[S.a])} – ${shortDate(CAL[S.b])} 2025 (${S.b - S.a + 1} gaming days)`;
const replaceTargets = () => (D.action_options.find(o => o.action_type_id === "A-REPLACE-LEASE")?.targets || "").split(", ").filter(Boolean);

function sectionMachines() {

  const shown = S.showAll ? sorted : sorted.slice(0, 15);

  const zsd = Math.sqrt(sum(sc.rows.filter(s => s.luck_z != null).map(s => s.luck_z ** 2)) / sc.rows.length);
  const col = (k, label, n = true) => `<th class="${n ? "n" : ""}"><button class="sort" data-sort="${k}">${label}${S.sort === k ? (S.asc ? " ↑" : " ↓") : ""}</button></th>`;

  <div class="sec-head"><div class="q">Question 1 · Which machines are truly underperforming?</div><h2>Separate the machine from its luck and its spot</h2>
  <p class="lede">Luck is tested exactly: each spin's payout variance comes from the published game math, so we know how far house win can stray from theo by chance alone. Location is handled by comparing every machine only with machines in the same zone on the same day, per hour it was available.</p></div>
  <div class="grid g4" style="margin-bottom:16px">
    ${tile("Spread of luck scores", f2(zsd), "Standard deviation of luck z across machines; 1.00 is pure chance. The floor behaves like honest dice.")}
    ${tile("Off spec beyond chance", String(nLeak), "Hit rate off the paytable (|z| > 6), or house win past luck z −3.6 (the cut-off for 310 simultaneous tests) over 150+ days. Shorter windows use the hit-rate test only: one jackpot can swing a week.")}
    ${tile("Weak earners for their spot", String(sc.rows.filter(s => s.verdict.startsWith("Weak")).length), "Fair index clearly (95% CI) under 0.85 of same-zone par.")}
    ${tile("Typical machine house win", fmtK(sc.typical), "Average per machine over the period, the benchmark every gap is measured from.")}
  </div>
  <div class="grid g2">
    <div class="panel">
      <h3>Luck against earning power</h3>
      <div class="sub">Each dot is a machine. Right = earns more theo than same-zone peers; down = house win below theo. Click a dot for its PAR check.</div>
      ${legend([{ label: "Manager's bottom 10", color: "--s1" }, { label: "Our replacement targets", color: "--s2" }, { label: "Leak lead", color: "--critical" }, { label: "Other machines", color: "--axis" }])}
      ${scatter()}
    </div>
    <div class="panel">
      <h3>The floor, by fair index</h3>
      <div class="sub">Machine positions from the floor plan (metres). Red earns under par for its zone, blue over. Rings mark the manager's 10.</div>
      ${floorMap()}
    </div>
  </div>
  <div class="panel" style="margin-top:16px" id="machine-detail">${machineDetail()}</div>
  <div class="panel" style="margin-top:16px">
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin-bottom:10px">
      <div><h3>Every machine</h3><div class="sub" style="margin:0">Drill into a zone or bank. ${rows.length} machines shown in the filter.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <label class="small ink2">Zone <select id="f-zone"><option value="all">All zones</option>${D.zones.map(zz => `<option value="${zz}"${zz === z ? " selected" : ""}>${esc(D.zoneName[zz])}</option>`).join("")}</select></label>
        <label class="small ink2">Bank <select id="f-bank"><option value="all">All banks</option>${banks.map(b => `<option${b === bk ? " selected" : ""}>${b}</option>`).join("")}</select></label>
      </div>
    </div>
    ${bk !== "all" || z !== "all" ? bankStrip(rows) : ""}
    <div class="tw"><table>
      <thead><tr>${col("machine_id", "Machine", false)}${col("zone_name", "Zone · bank", false)}${col("manager_rank", "Mgr #")}${col("fair_rank", "Fair #")}${col("house_win_usd", "House win")}${col("theo_usd", "Theo")}${col("luck_z", "Luck z")}${col("hit_rate_z", "Hit z")}${col("fair_index", "Fair idx")}${col("availability", "Uptime")}<th>Verdict</th></tr></thead>
      <tbody>${shown.map(s => `<tr class="clickable${S.sel === s.machine_id ? " sel" : ""}" data-pick="${s.machine_id}" tabindex="0">
        <td class="mono">${s.machine_id}<div class="small muted">${esc(s.theme)}</div></td><td>${esc(s.zone_name)}<div class="small muted mono">${s.bank_id}</div></td>
        <td class="n">${s.manager_rank}</td><td class="n">${s.fair_rank}</td><td class="n">${fmtK(s.house_win_usd)}</td><td class="n">${fmtK(s.theo_usd)}</td>
        <td class="n">${f2(s.luck_z)}</td><td class="n">${f2(s.hit_rate_z)}</td><td class="n">${f2(s.fair_index)}<span class="muted small"> ±${(1.96 * (s.fair_index_se || 0)).toFixed(2)}</span></td><td class="n">${pct(s.availability, 1)}</td><td>${verdictChip(s.verdict)}</td></tr>`).join("")}</tbody>
    </table></div>
    ${sorted.length > 15 ? `<button type="button" id="show-all" style="margin-top:10px">${S.showAll ? "Show top 15" : `Show all ${sorted.length}`}</button>` : ""}
  </div>
  </section>`;
}
function tile(l, v, d) { return `<div class="tile"><span class="l">${esc(l)}</span><span class="v">${v}</span><span class="d">${esc(d)}</span></div>`; }
function bankStrip(rows) {
  const md = sum(rows.map(r => r.days_on_floor)), th = sum(rows.map(r => r.theo_usd)), hw = sum(rows.map(r => r.house_win_usd)), lk = sum(rows.map(r => r.luck_usd)), lc = sum(rows.map(r => r.location_usd));
  const fl = sc.rows, flth = sum(fl.map(r => r.theo_usd)) / sum(fl.map(r => r.days_on_floor));
  return `<div class="grid g4" style="margin-bottom:12px">${tile("Theo per machine-day", fmtUSD(th / md), `Floor: ${fmtUSD(flth)}`)}${tile("House win", fmtK(hw), `Luck: ${fmtSigned(lk)}`)}${tile("Location effect", fmtSigned(lc), "vs. floor-average zone, summed over machines")}${tile("Verdicts", String(rows.filter(r => r.verdict.startsWith("Weak")).length) + " weak", `${rows.filter(r => r.verdict === "Unlucky").length} unlucky · ${rows.filter(r => r.verdict === "Quiet location").length} quiet location`)}</div>`;
}

function scatter() {
  const W = 560, H = 360, L = 44, R = 14, T = 12, B = 34;
  const pts = sc.rows.filter(s => s.fair_index != null && s.luck_z != null);
  const xs = pts.map(s => s.fair_index), ys = pts.map(s => Math.max(-6, Math.min(4, s.luck_z)));
  const x0 = Math.min(0.4, ...xs), x1 = Math.max(1.6, ...xs), y0 = -5, y1 = 4;
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R), sy = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const targets = replaceTargets();
  let g = "";
  niceTicks(x0, x1, 6).forEach(t => g += `<line class="grid-line" x1="${sx(t)}" x2="${sx(t)}" y1="${T}" y2="${H - B}"/><text x="${sx(t)}" y="${H - B + 14}" text-anchor="middle">${t.toFixed(1)}</text>`);
  [-4, -2, 0, 2, 4].forEach(t => g += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${L - 6}" y="${sy(t) + 4}" text-anchor="end">${t}</text>`);
  g += `<line class="axis-line" x1="${sx(1)}" x2="${sx(1)}" y1="${T}" y2="${H - B}"/>`;
  g += `<rect x="${L}" y="${sy(-3.6)}" width="${W - L - R}" height="${sy(y0) - sy(-3.6)}" fill="var(--critical)" opacity=".06"/><text x="${W - R - 4}" y="${sy(-3.6) + 13}" text-anchor="end" class="lbl">beyond chance (z < −3.6)</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle" class="lbl">Fair index (theo vs. same-zone par)</text><text x="12" y="${T + 6}" class="lbl" transform="rotate(-90 12 ${T + 6})" text-anchor="end">Luck z</text>`;
  const order = s => s.verdict.startsWith("Leak") ? 3 : s.manager_rank <= 10 ? 2 : targets.includes(s.machine_id) ? 1 : 0;
  [...pts].sort((a, b) => order(a) - order(b)).forEach(s => {
    const o = order(s), c = o === 3 ? "--critical" : o === 2 ? "--s1" : o === 1 ? "--s2" : "--axis";
    const sel = S.sel === s.machine_id;
    const t = tipRows(`${s.machine_id} · ${s.theme}`, [["Zone", esc(s.zone_name)], ["Fair index", f2(s.fair_index)], ["Luck z", f2(s.luck_z)], ["House win", fmtK(s.house_win_usd)], ["Verdict", esc(s.verdict)]]);
    g += `<circle cx="${sx(s.fair_index).toFixed(1)}" cy="${sy(Math.max(y0 + 0.1, Math.min(y1, s.luck_z))).toFixed(1)}" r="${o ? 5 : 4}" fill="var(${c})" stroke="${sel ? "var(--brass)" : "var(--surface)"}" stroke-width="${sel ? 3 : 2}" data-pick="${s.machine_id}" data-tip="${esc(t)}" style="cursor:pointer"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter of fair index against luck z-score for every machine">${g}</svg></div>`;
}

function divColor(v) {
  // diverging: red below par, grey at par, blue above; clamp 0.5 .. 1.5
  const t = Math.max(-1, Math.min(1, (v - 1) / 0.5));
  return t < 0 ? `color-mix(in oklab, var(--div-neg) ${Math.round(-t * 100)}%, var(--div-mid))` : `color-mix(in oklab, var(--div-pos) ${Math.round(t * 100)}%, var(--div-mid))`;
}
function floorMap() {
  const W = 640, H = 560, pad = 26, minX = -4, maxX = 140, minY = -10, maxY = 118;
  const sx = v => pad + (v - minX) / (maxX - minX) * (W - 2 * pad), sy = v => pad + (v - minY) / (maxY - minY) * (H - 2 * pad);
  const zones = D.floor_nodes.filter(n => n.node_type === "zone"), zxy = Object.fromEntries(zones.map(z => [z.location_id, z]));
  let g = "";
  const closedNow = w => w.closed_from_utc && inPeriod(String(w.closed_from_utc).slice(0, 10)) || (w.closed_to_utc && inPeriod(String(w.closed_to_utc).slice(0, 10)));
  D.walkways.forEach(w => { const a = zxy[w.zone_a], b = zxy[w.zone_b]; if (!a || !b) return; const closed = w.closure_reason && closedNow(w);
    g += `<line x1="${sx(a.x_m)}" y1="${sy(a.y_m)}" x2="${sx(b.x_m)}" y2="${sy(b.y_m)}" stroke="${closed ? "var(--critical)" : "var(--rule)"}" stroke-width="${closed ? 3 : 8}" stroke-linecap="round"${closed ? ' stroke-dasharray="6 5"' : ""} data-tip="${esc(`<b>Walkway ${w.walkway_id}</b>${w.closure_reason ? `<div>Closed for ${esc(w.closure_reason)} ${String(w.closed_from_utc).slice(0, 10)} → ${String(w.closed_to_utc).slice(0, 10)}</div>` : ""}<div class="row"><span>length</span><span>${w.length_m} m</span></div>`)}"/>`; });
  const mgr = new Set(sc.rows.filter(s => s.manager_rank <= 10).map(s => s.machine_id));
  sc.rows.filter(s => !(s.retire_date && s.retire_date <= CAL[S.b])).forEach(s => {
    const dim = (S.zone !== "all" && s.zone_id !== S.zone) || (S.bank !== "all" && s.bank_id !== S.bank);
    const sel = S.sel === s.machine_id, isM = mgr.has(s.machine_id);
    const t = tipRows(`${s.machine_id} · ${s.theme}`, [["Zone · bank", esc(s.zone_name + " · " + s.bank_id)], ["Fair index", f2(s.fair_index)], ["Verdict", esc(s.verdict)]]);
    g += `<rect x="${(sx(s.x) - 4.5).toFixed(1)}" y="${(sy(s.y) - 4.5).toFixed(1)}" width="9" height="9" rx="2" fill="${divColor(s.fair_index)}" stroke="${sel ? "var(--brass)" : isM ? "var(--ink)" : "var(--surface)"}" stroke-width="${sel ? 3 : isM ? 1.6 : 1}" opacity="${dim ? 0.25 : 1}" data-pick="${s.machine_id}" data-tip="${esc(t)}" style="cursor:pointer"/>`;
  });
  zones.forEach(z => g += `<text x="${sx(z.x_m)}" y="${sy(z.y_m) - 10}" text-anchor="middle" class="lbl" style="font-weight:600">${esc(z.name)}</text>`);
  D.floor_nodes.filter(n => n.node_type === "entrance").forEach(n => g += `<path d="M${sx(n.x_m) - 7},${sy(n.y_m)} h14" stroke="var(--brass)" stroke-width="4" stroke-linecap="round"/><text x="${sx(n.x_m) + (n.x_m > 100 ? -10 : 10)}" y="${sy(n.y_m) + (n.y_m < 5 ? 16 : n.y_m > 100 ? -6 : 4)}" text-anchor="${n.x_m > 100 ? "end" : "start"}">${esc(n.name)}</text>`);
  D.floor_nodes.filter(n => n.node_type === "outlet").forEach(n => g += `<circle cx="${sx(n.x_m)}" cy="${sy(n.y_m)}" r="5" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/><text x="${sx(n.x_m) + 8}" y="${sy(n.y_m) + 4}">${esc(n.name)}</text>`);
  const key = `<div class="legend" style="margin-top:6px"><span>Fair index</span><span style="display:inline-block;width:140px;height:9px;border-radius:2px;background:linear-gradient(90deg,var(--div-neg),var(--div-mid),var(--div-pos))"></span><span class="mono small">0.5 · 1.0 · 1.5</span><span><span class="key-line" style="background:var(--critical)"></span>Walkway closed in period</span></div>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Floor plan with machines coloured by fair index">${g}</svg></div>${key}`;
}

function machineDetail() {
  const s = sc.by[S.sel] || sc.rows[0]; if (!s) return "";
  const md = D.machine_day, rows = D.byMachine[s.m].filter(r => md.d[r] >= S.a && md.d[r] <= S.b);
  const x = rows.map(r => CAL[md.d[r]]);
  let ch = 0, ct = 0, cv = 0; const hw = [], th = [], lo = [], hi = [];
  rows.forEach(r => { ch += md.hw[r] / 100; ct += md.ci[r] * (1 - s.rtp) / 100; cv += md.vr[r] / 1e4; hw.push(ch); th.push(ct); lo.push(ct - 2 * Math.sqrt(cv)); hi.push(ct + 2 * Math.sqrt(cv)); });
  const maxAbs = Math.max(...CAUSES.map(c => Math.abs(s[c.key + "_usd"])), 1);
  const sql = D.sqlScore[s.machine_id];
  const fullNote = S.a === 0 && S.b === NDAYS - 1 && sql ? `<span class="small muted">Pipeline verdict: ${esc(sql.verdict)}</span>` : "";
  return `<div class="detail">
    <div class="head"><span class="eyebrow">PAR check</span><span class="mid">${s.machine_id}</span><span class="ink2">${esc(s.theme)} · ${esc(s.manufacturer)} · ${esc(s.lease_class.replace(/_/g, " "))} · ${esc(s.zone_name)} ${s.bank_id} · published RTP ${pct(s.rtp, 0)} (${esc(s.volatility_class.replace("_", " "))} volatility)</span>${verdictChip(s.verdict)}${fullNote}</div>
    <div class="kv">
      <div><span class="k">House win</span><span class="v">${fmtK(s.house_win_usd)}</span></div>
      <div><span class="k">Theo (expected)</span><span class="v">${fmtK(s.theo_usd)}</span></div>
      <div><span class="k">Hold vs. spec</span><span class="v">${pct(s.observed_hold, 1)} / ${pct(s.theo_hold, 0)}</span></div>
      <div><span class="k">Luck z</span><span class="v">${f2(s.luck_z)}</span></div>
      <div><span class="k">Hit rate vs. paytable</span><span class="v">${pct(s.observed_hit_rate, 1)} / ${pct(s.spec_hit, 1)}</span></div>
      <div><span class="k">Hit-rate z</span><span class="v${Math.abs(s.hit_rate_z) > 6 ? " flag" : ""}">${f2(s.hit_rate_z)}</span></div>
      <div><span class="k">Fair index (95% CI)</span><span class="v">${f2(s.fair_index)} ± ${(1.96 * (s.fair_index_se || 0)).toFixed(2)}</span></div>
      <div><span class="k">Uptime · days on floor</span><span class="v">${pct(s.availability, 1)} · ${s.days_on_floor}</span></div>
    </div>
    <div class="grid g2">
      <div><h3 style="font-size:1.05rem;margin-bottom:6px">Gap to a typical machine: ${fmtSigned(s.gap_usd)}</h3>
        ${hbars(CAUSES.map(c => ({ label: c.label, value: s[c.key + "_usd"], c: c.color })), { fmt: fmtSigned, colorOf: r => r.c, max: maxAbs })}
        <p class="small muted" style="margin-top:8px">The six parts add up exactly to the gap. Location = what an average machine in its zone earned vs. the floor; hold setting = theo lost to a more generous paytable than its zone neighbours.</p></div>
      <div><h3 style="font-size:1.05rem;margin-bottom:6px">Cumulative house win vs. theo</h3>
        ${legend([{ label: "House win", color: "--s1", line: true }, { label: "Theo with ±2σ luck band", color: "--s2", line: true }])}
        ${lineChart("machine", { x, series: [{ name: "House win", color: "--s1", values: hw, endLabel: true }, { name: "Theo", color: "--s2", values: th, band: [lo, hi], width: 1.5 }], height: 220, label: `Cumulative house win and theo for ${s.machine_id}` })}
        <p class="small muted" style="margin-top:6px">${s.verdict.startsWith("Leak") ? "House win falls outside what the published game math allows by chance: a reason to inspect the paytable, not proof of wrongdoing." : s.luck_z < -3.6 ? "Luck z is past −3.6, but over fewer than 150 days one big jackpot can do that, and the hit rate is within spec: not treated as off spec." : "House win stays inside the band chance allows: the gap here is not luck."}</p></div>
    </div></div>`;
}

function sectionDemand() {
  const fd = D.floor_day.filter(r => inPeriod(String(r.gaming_date).slice(0, 10)));
  const x = fd.map(r => String(r.gaming_date).slice(0, 10));
  const evBands = D.event_lift.filter(e => inPeriod(e.start_date) || inPeriod(e.end_date)).map(e => ({ from: e.start_date < x[0] ? x[0] : e.start_date, to: e.end_date > x[x.length - 1] ? x[x.length - 1] : e.end_date, label: "", color: e.local_scope === "property" ? "--brass-wash" : "--rule", opacity: 0.9 }));
  const zw = D.zone_week.filter(r => inPeriod(String(r.week_start).slice(0, 10)) || inPeriod(addDays(String(r.week_start).slice(0, 10), 6)));
  const weeks = [...new Set(zw.map(r => String(r.week_start).slice(0, 10)))].sort();
  const b40 = weeks.map(w => zw.find(r => r.zone_id === "Z-B40" && String(r.week_start).slice(0, 10) === w)?.coin_in_per_machine_day_usd ?? null);
  const others = weeks.map(w => { const rr = zw.filter(r => r.zone_id !== "Z-B40" && String(r.week_start).slice(0, 10) === w); return rr.length ? sum(rr.map(r => r.coin_in_per_machine_day_usd * r.machine_days)) / sum(rr.map(r => r.machine_days)) : null; });
  const months = monthsInPeriod();
  const monthly = months.map(m => { const r = D.floor_day.filter(d => d.month === m); return { m, ci: sum(r.map(d => d.coin_in_usd)) / r.length, yoy: r[0]?.city_visitor_yoy, conv: r[0]?.city_convention_attendance_month }; });

  <div class="sec-head"><div class="q">Question 2 · What changed in demand, and why?</div><h2>Demand followed access, events and the city</h2>

  <div class="panel">
