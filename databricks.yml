# Databricks Asset Bundle for "Luck, Location, or a Leak?" (TAMU Datathon 2026)
# Deploy:  databricks bundle deploy -t dev   &&   databricks bundle run gilded_ace_job -t dev
bundle:
  name: gilded-ace-floor-analytics

variables:
  catalog:
    description: Unity Catalog catalog to write into (Free Edition ships with `workspace`).
    default: workspace
  schema:
    description: Schema that holds the raw volume and every bronze/silver/gold table.
    default: gilded_ace
  ml_schema:
    description: >-
      Schema for the tables the notebooks write (forecast outputs + expectation_log). Kept apart from
      `schema` because Free Edition caps a schema at 100 tables and the pipeline's 52 tables plus their
      internal backing tables already use ~104 of them.
    default: gilded_ace_ml
  data_release_url:
    description: Where the challenge's Parquet files are downloaded from.
    default: https://raw.githubusercontent.com/tamu-datathon-org/dashboard-royale/main/data

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
