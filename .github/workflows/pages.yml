# Publishes the dashboard/ folder to GitHub Pages: https://chintan-22.github.io/tamu_databricks/
# GitHub Pages can only serve the repo root or /docs, so this uploads dashboard/ as a Pages artifact.
# It runs only after CI has passed on main, so a dashboard that fails the checks never goes live.
# Repo setting it needs (once): Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful CI run from a push to main (not a PR, schedule, or failure); manual runs always deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI checked, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
